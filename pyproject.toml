[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sock-dressing-simulation"
version = "0.1.0"
description = "Phase 1 RCareWorld sock-dressing scene and data contracts"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.21,<3", "Pillow>=8,<12", "PyYAML>=5.4,<7"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
fit = ["scipy>=1.7,<2"]
geometry = ["scipy>=1.7,<2", "trimesh>=4,<5", "python-fcl>=0.7,<0.8", "shapely>=1.7,<3", "matplotlib>=3.6,<4"]
decomposition = ["coacd>=1.0.5,<2", "rtree>=1.3,<2"]
inference = [
  "torch",
  "torchvision",
  "scipy",
  "opencv-python",
  "hydra-core",
  "iopath",
  "tqdm",
]

[project.scripts]
sock-sim = "sock_dressing_simulation.cli:main"

[tool.setuptools]
packages = ["sock_dressing_simulation"]

[tool.setuptools.package-data]
sock_dressing_simulation = ["../config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
