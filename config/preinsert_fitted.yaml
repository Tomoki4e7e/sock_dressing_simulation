extends: preinsert_normal.yaml

# Physical rest-circumference contraction followed by a full-gravity hold.
rcareworld:
  executable: Build/SockDressingPlayer/CircumferenceFitV5/Player.x86_64
obi:
  expected:
    stretch_compliance: 0.00001
    bend_compliance: 0.01
    # Sampling radius for cloth self-contact; foot/calf gap is separately 2.5 mm.
    particle_radius_m: 0.007
    collision_margin_m: 0.0005
    # 50 g distributed over this mesh's 801 finite-mass particles.
    particle_mass_kg: 0.00006242197253433208
    friction: 1.0
    damping: 0.9
    substeps: 8
    solver_iterations: 30
  substeps: 8
  solver_iterations: 30
circumference_fit:
  minimum_scale: 0.48
  scale_step: 0.01
  settle_steps: 5
  hold_steps: 500
  target_cuff_force_n: 0.08
