extends: default.yaml

rcareworld:
  profile: custom_player
  commit: greenfield-sock-cloth-v1
  native_rcareworld: true
  executable: Build/SockDressingPlayer/Development/Player.x86_64
  checkout: RCareUnity
  graphics: false
  log_level: 1
  port: 5005

scene:
  scene_file: HumanBodyIK.json
  preloaded: false
  human_id: 168242
  camera_id: 1300
  # Keep the learning camera attached to the physical right See3CAM while this
  # profile translates the complete robot away from the default world pose.
  camera_parent_link: "head/see3cam_right/camera_color_frame"
  camera_local_position: [0.0, 0.0, 0.0]
  # Match the downward-looking real camera framing: torso/arms at the lower
  # edge and the raised foot/sock in the central field of view.
  camera_local_rotation: [20.0, 0.0, 0.0]
  recording_camera_id: 1301
  # Close overview centered on both grippers, the physical cuff and the toe.
  recording_camera_position: [-1.10, 0.85, -0.55]
  recording_camera_rotation: [10.0, 42.0, 0.0]
  recording_camera_frame_opening: false
  recording_camera_opening_distance_m: 0.35
  recording_camera_opening_lateral_m: -0.20
  recording_camera_opening_reverse: true
  # Calibrated so the ka grippers meet the canonical HumanBodyIK sock pose.
  robot_position: [-0.144, -0.15, 0.88]
  robot_immovable: true
  robot_joint_gravity: false
  # Initialization remains deterministic; autonomous rollout uses drive targets
  # so PhysX can resolve gripper/foot contacts instead of teleporting through.
  robot_direct_joint_control: true
  robot_rollout_direct_joint_control: false
  ignore_robot_human_rigid_collisions: false
  ignore_non_gripper_robot_human_rigid_collisions: true
  human_position: [0.06, 1.48, -0.72]
  sock_position: [-0.14, 0.53, 0.68]
  sock_rotation: [0.0, 0.0, 0.0]
  human_foot_collider_ids: [2101, 2102, 2103, 2104, 2105]
  contact_proxy_ids: [2101, 2102, 2103, 2104, 2105, 2201, 2202, 2301]
  enable_human_obi_collider: true
  visuals:
    # The canonical skinned avatar is authoritative. Capsule bones are debug-only.
    human_proxy: false
    task_right_toe_position: [-0.14, 0.53, 0.608]
  chair:
    enabled: true
    asset_name: Collider_Box
    parts:
      - {id: 2301, name: chair, position: [0.0, 0.48, -0.18], scale: [0.62, 0.10, 0.58]}
  grasp_anchors:
    enabled: true
    attach: false
    auto_grasp: true
    align_sock_to_grippers: true
    max_distance_m: 0.04
    # Keep both targets at the configured grasping_frame origins. The sock
    # opening is stretched to this live span instead of moving either target.
    maximum_anchor_span_m: null
    anchors:
      - {id: 2201, side: left, parent_link: "left_gripper/grasping_frame", local_position: [0.0, 0.0, 0.0]}
      - {id: 2202, side: right, parent_link: "right_gripper/grasping_frame", local_position: [0.0, 0.0, 0.0]}
  grasp_alignment:
    enabled: true
    target_span_m: 0.105
    tolerance_m: 0.015
    finite_difference_rad: 0.02
    damping: 0.002
    maximum_joint_step_rad: 0.06
    maximum_iterations: 20
    joint_settle_steps: 3
  initial_pose_contract:
    calibrate_foot_to_sock: true
    enforce: true
    # Translate the seated human and chair together during calibration, then
    # stop following the moving cuff for the autonomous dressing rollout.
    lock_human_and_chair: true
    maximum_lock_drift_m: 0.002
    straight_right_leg: true
    right_knee_flexion_max_degrees: 2.0
    foot_to_sock_m: 0.10
    foot_to_sock_tolerance_m: 0.02
    foot_lateral_tolerance_m: 0.035
    opening_to_toe_alignment_min: 0.90
    # The opening lip itself is held at each grasping_frame origin.
    minimum_cuff_insertion_depth_m: 0.0
    maximum_opening_edge_error_m: 0.01
    required_grasp_particles_per_side: 4
    grasp_patch_span_tolerance_m: 0.006
    maximum_grasp_corner_error_m: 0.006
    minimum_grasp_thickness_axis_alignment: 0.95
    maximum_opening_span_m: 0.12
    maximum_cloth_bounds_span_m: 0.35
    # The body is allowed to rotate and fold away from a prescribed axis.
    sock_body_gravity_alignment_min: -1.0
    right_leg_raise_degrees: 90.0
    right_leg_raise_tolerance_degrees: 16.0
    expected_human_position: [0.06, 1.48, -0.72]
    expected_chair_position: [0.0, 0.48, -0.18]
  stable_ids:
    sock: 1200
    robot: 1100
    human: 168242
    calf: 2101
    ankle: 2102
    heel: 2103
    forefoot: 2104
    toes: 2105
    left_gripper: 2201
    right_gripper: 2202
    chair: 2301
    floor: 2302

obi:
  expected:
    protocol_version: sock-cloth-v1
    obi_available: true
    # Allow a small amount of axial/circumferential give so gravity and arm
    # motion are absorbed by the cloth instead of peeling the cuff off the tips.
    stretch_compliance: 0.00001
    bend_compliance: 0.01
    stretching_scale: 1.0
    # Reject any rollout that stretches the 40 mm rest radius beyond 60 mm.
    maximum_circumferential_stretch: 1.5
    strain_limit_iterations: 200
    # Avoid a rigid long-range cage; local structural constraints and the
    # explicit 1.5x edge limiter remain authoritative.
    tether_constraints: false
    tether_compliance: 0.0
    tether_scale: 1.0
    self_collision: true
    damping: 0.95
    substeps: 8
    solver_iterations: 20
    particle_radius_m: 0.008
    particle_mass_kg: 0.005
    collision_margin_m: 0.002
    friction: 0.5
    # The grasped cuff must follow autonomous arm motion without accumulating
    # metres-scale pin error; cloth compliance remains in the structural mesh.
    grasp_linear_compliance: 0.00005
    # Lip and inner-band position pins define the cuff plane; leave particle
    # bend/twist unconstrained so the fabric can drape without artificial strain.
    grasp_rotational_compliance: 1000000.0
    grasp_break_threshold: 20.0
    # Four lip particles per side distribute cuff load without rigidly pinning
    # the complete opening.
    maximum_grasp_particles_per_side: 4
    # GripperV2 finger thickness is about 45 mm. Pin the opening at local-X
    # offsets of +/-22 mm so the four held particles form a 44 mm short edge.
    grasp_thickness_half_width_m: 0.025
    # Use the inner cuff ring to estimate the opening normal and taper the
    # initial diameter stretch over the first 3 cm of the sock.
    cuff_insertion_depth_m: 0.03
    slip_constraint_error_m: 0.20
    slip_opening_span_m: 0.11
    slip_consecutive_steps: 2
  settings_applied: true
  version: player-reported
  timestep_s: 0.02
  substeps: 8
  solver_iterations: 20

inference:
  use_renderer_masks: true
  training_data_root: .
  training_manifest: artifacts/sarnn-expert/dataset_sarnn_expert.yaml
  training_dataset_name: sarnn_custom
  training_config: config/custom_player_training.yaml
  output_dir: artifacts/phase4/model_custom
  checkpoint: artifacts/phase4/model_custom/SARNN_latest.pth
  stats: artifacts/phase4/model_custom/data.json
  preserve_resume_stats: true
  resume_optimizer: false
  # One policy action represents 0.2 s at 5 Hz; Unity fixedDeltaTime is 0.02 s.
  physics_steps_per_action: 10
  # Renderer masks are exact (IoU 1.0); allow rapid projected-area changes as
  # the retained grasp moves the sock toward/away from the head camera.
  mask_max_area_change: 25.0
  reference_actions: artifacts/dressing-trial-bimanual-sync-fix/dressing_trial_20260922T082802Z/training_episode/angle.csv
  reference_action_blend: 1.0
  reference_action_hold_steps: 10
  reference_action_interpolation: linear
  reference_cartesian_pull_m: 0.02
  maximum_grasp_edge_error_m: 0.20
  minimum_follow_displacement_m: 0.02
  maximum_distal_follow_error_m: 0.05
  minimum_distal_follow_ratio: 0.5
  # Preserve the complete video when pins remain attached but the visual edge
  # metric exceeds its strict success threshold; metadata still reports failure.
  abort_on_grasp_qa_failure: false
  recording_crop_xywh: [300, 330, 520, 390]
  semantic_mask:
    require_prompt_containment: true
    keep_prompt_components: false
    sock_min_fraction: 0.0001
    sock_max_fraction: 0.15
    leg_min_fraction: 0.0001
    # The articulated raised-leg pose occupies about 18% of the head-camera
    # frame; renderer IoU/centroid checks still reject incorrect masks.
    leg_max_fraction: 0.25
    # A head-mounted view sees the sock projected directly over the foot while
    # dressing; renderer agreement still prevents broad/incorrect components.
    maximum_overlap_fraction: 1.0

scenario:
  sock:
    position: [-0.14, 0.53, 0.68]
    rotation: [0.0, 0.0, 0.0]
    closed_toe: true
    # Rest-shape the free body downward after a straight 3 cm cuff. This keeps
    # the opening toe-facing without stretching a straight tube into a 90° bend.
    rest_bend_start_m: 0.03
    rest_bend_length_m: 0.18
    rest_bend_degrees: 90.0
  foot:
    ik_index: null
    position: [0.0, 0.93, 0.68]
  support_foot:
    ik_index: null

dressing_trial:
  trajectory_mode: arm_jacobian
  axial_pull_m: 0.04
  waypoint_count: 5
  hold_steps: 3
  maximum_tracking_error_m: 0.08
  minimum_coverage_gain: 0.10
  expert_minimum_coverage_gain: 0.09
  required_grippers: 2
  tuning:
    grasp_max_distance_m: [0.04, 0.07, 0.10]
    friction: [0.0, 0.1, 0.3]
    grasp_linear_compliance: [0.00010, 0.00020, 0.00050]
    grasp_break_threshold: [5.0, 10.0, 20.0]
    slip_constraint_error_m: [0.015, 0.025, 0.040]
    slip_opening_span_m: [0.085, 0.100, 0.110]
    axial_pull_m: [0.12, 0.15, 0.18]

dressing_player:
  required_grippers: 2
  minimum_coverage_gain: 0.03
  require_foot_contact: true
  maximum_robot_human_penetration_m: 0.005
  minimum_final_surface_containment: 0.90
  minimum_final_section_containment: 0.80
  final_coverage_hold_frames: 3
  minimum_cuff_progress_toward_ankle_m: 0.0
  maximum_cuff_reverse_m: 0.002
  maximum_cuff_beyond_distal_toe_m: 0.002
  maximum_cloth_foot_penetration_m: 0.002
  abort_on_cloth_foot_qa_failure: false
