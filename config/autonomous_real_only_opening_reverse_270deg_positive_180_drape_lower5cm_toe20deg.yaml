extends: autonomous_real_only_opening_reverse_270deg_positive_180_drape.yaml

scenario:
  foot:
    # Ten degrees more toe-up than the inherited 30-degree plantarflexion.
    rotation: [20.0, 0.0, 0.0]
    plantarflexion_degrees: 20.0

scene:
  initial_pose_contract:
    # Translate the straight-leg task pose and chair down in Unity world Y.
    # The authored human root stays fixed to avoid applying this translation
    # twice; the world-space human anchor carries the displayed body pose.
    down_m: 0.05
    locked_pose_baseline:
      # Adjust the pre-translation toe target for the 20-degree foot direction.
      # The 5 cm grid offset is applied after this baseline is loaded.
      right_toe_position: [-0.1826222241, 0.4936948466, 0.5976466234]
    # The lowered toe-up pose measured the guided tip at -0.1949 m. Retain a
    # narrow arm-loop corridor while allowing one centimetre of initialization
    # variance relative to the inherited -0.200 m upper bound.
    sock_tip_cross_axis_offset_max_m: -0.190

inference:
  # The lowered toe-up pose can leave only 11 exact renderer-confirmed sock
  # pixels in the fixed head view, and a repeat reached 5 pixels. Accept any
  # nonempty, exact IoU-verified projection while keeping zero-area masks
  # fail-closed (one 1280x960 pixel is approximately 8.14e-7).
  mask_min_fraction: 0.0000001
  semantic_mask:
    sock_min_fraction: 0.0000001
