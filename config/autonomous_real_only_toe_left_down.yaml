extends: autonomous_real_only.yaml

scene:
  initial_pose_contract:
    # Unity uses Y-up. In the current Dry-AIREC pose, the named left gripper is
    # on the +X side of the right gripper, so robot-left is world +X.
    right_toe_offset_world_m: [0.05, -0.05, 0.0]
    right_toe_offset_tolerance_m: 0.005
    # Calibration retains the canonical extended knee. Applying the offset then
    # explicitly switches only the task leg to the articulated two-bone solve.
    straight_right_leg: true
    right_knee_flexion_max_degrees: 30.0
    right_leg_raise_tolerance_degrees: 20.0
